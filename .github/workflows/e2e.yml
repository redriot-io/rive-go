name: e2e

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    name: Playwright e2e (render + interaction)
    runs-on: ubuntu-latest

    steps:
      # ── repo ─────────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Go (needed for rivtool / example generation) ──────────────────────────
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build rivtool
        run: go build ./cmd/rivtool/

      # ── Node ─────────────────────────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm deps
        working-directory: tests/e2e
        run: npm install

      # ── Playwright browsers ───────────────────────────────────────────────────
      - name: Install Playwright browsers
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium

      # ── static server (managed outside Playwright for reliability) ────────────
      - name: Start static server
        working-directory: tests/e2e
        run: |
          node server.js &
          echo "SERVER_PID=$!" >> $GITHUB_ENV
          # Wait up to 20s for the server to respond
          for i in $(seq 1 20); do
            curl -s http://127.0.0.1:5173/ > /dev/null && echo "Server ready" && break
            echo "Waiting ($i)..."
            sleep 1
          done

      # ── e2e tests ─────────────────────────────────────────────────────────────
      - name: Run Playwright tests
        working-directory: tests/e2e
        run: npx playwright test --reporter=github,list
        env:
          CI: true

      # ── cleanup ───────────────────────────────────────────────────────────────
      - name: Stop static server
        if: always()
        run: kill $SERVER_PID || true

      # ── artifacts ─────────────────────────────────────────────────────────────
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 14
