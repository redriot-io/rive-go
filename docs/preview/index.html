<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>rive-go · Live Previews</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2d3e;
      --accent: #6c63ff;
      --accent2: #ff6584;
      --text: #e0e0f0;
      --muted: #888aaa;
      --radius: 12px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      padding: 2rem 1rem 4rem;
    }

    header {
      text-align: center;
      margin-bottom: 3rem;
    }

    header h1 {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    header h1 span { color: var(--accent); }

    header p {
      color: var(--muted);
      margin-top: 0.5rem;
      font-size: 1.05rem;
    }

    header .badge-row {
      margin-top: 1rem;
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    header .badge-row a img { height: 22px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
      max-width: 1100px;
      margin: 0 auto;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 30px rgba(108, 99, 255, 0.15);
    }

    .canvas-wrap {
      background: #12141f;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 220px;
      position: relative;
    }

    canvas { max-width: 100%; max-height: 100%; }

    .card-body {
      padding: 1rem 1.25rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
    }

    .card-desc {
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.5;
    }

    .tag-row {
      display: flex;
      gap: 0.35rem;
      flex-wrap: wrap;
      margin-top: 0.2rem;
    }

    .tag {
      font-size: 0.72rem;
      padding: 0.15rem 0.55rem;
      border-radius: 99px;
      background: rgba(108, 99, 255, 0.15);
      color: var(--accent);
      border: 1px solid rgba(108, 99, 255, 0.3);
    }

    .tag.red {
      background: rgba(255, 101, 132, 0.12);
      color: var(--accent2);
      border-color: rgba(255, 101, 132, 0.25);
    }

    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--muted);
      position: absolute;
      top: 10px; right: 12px;
    }
    .status-dot.ok { background: #4caf88; }
    .status-dot.err { background: #e05a5a; }

    footer {
      text-align: center;
      margin-top: 3.5rem;
      color: var(--muted);
      font-size: 0.82rem;
    }
    footer a { color: var(--accent); text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<header>
  <h1>rive<span>-go</span> · Live Previews</h1>
  <p>Six demo scenes generated entirely in Go — no editor, no manual authoring.</p>
  <div class="badge-row">
    <a href="https://github.com/redriot-io/rive-go" target="_blank">
      <img src="https://img.shields.io/badge/GitHub-redriot--io%2Frive--go-6c63ff?logo=github&logoColor=white" alt="GitHub" />
    </a>
    <a href="https://pkg.go.dev/github.com/redriot-io/rive-go" target="_blank">
      <img src="https://pkg.go.dev/badge/github.com/redriot-io/rive-go.svg" alt="Go Reference" />
    </a>
    <a href="https://github.com/redriot-io/rive-go/actions" target="_blank">
      <img src="https://img.shields.io/github/actions/workflow/status/redriot-io/rive-go/ci.yml?label=CI&logo=githubactions&logoColor=white" alt="CI" />
    </a>
  </div>
</header>

<div class="grid" id="grid"></div>

<footer>
  Generated by <a href="https://github.com/redriot-io/rive-go/tree/main/cmd/examples">cmd/examples</a> ·
  Rendered via <a href="https://rive.app/community/doc/web-js/docvlgbnS1mp" target="_blank">@rive-app/canvas</a>
</footer>

<script src="https://unpkg.com/@rive-app/canvas@2"></script>
<script>
const demos = [
  {
    file: "examples/fade_rect.riv",
    title: "Fade Rectangle",
    desc: "A red rectangle that fades from invisible to fully opaque, driven by a looping LinearAnimation.",
    tags: ["animation", "opacity"],
  },
  {
    file: "examples/bounce_ball.riv",
    title: "Bounce Ball",
    desc: "A circle that bounces on the Y-axis using a cubic ease-in-out keyframe pair on a ping-pong loop.",
    tags: ["animation", "cubic easing", "ping-pong"],
  },
  {
    file: "examples/color_cycle.riv",
    title: "Color Cycle",
    desc: "Three color keyframes on a SolidColor cycle the fill of a rectangle through red → green → blue.",
    tags: ["animation", "color keyframes"],
  },
  {
    file: "examples/toggle_button.riv",
    title: "Toggle Button",
    desc: "A shape connected to a StateMachine with a Boolean input. Transitions drive Off ↔ On states.",
    tags: ["state machine", "boolean input"],
    tagClass: "red",
  },
  {
    file: "examples/gradient_ellipse.riv",
    title: "Gradient Ellipse",
    desc: "A static ellipse with a two-stop LinearGradient fill — shows gradient paint construction.",
    tags: ["gradient", "static"],
  },
  {
    file: "examples/multi_shape.riv",
    title: "Multi-Shape",
    desc: "Three shapes (two rects + ellipse) arranged on one artboard, each with its own solid-color fill.",
    tags: ["shapes", "layout"],
  },
];

const grid = document.getElementById('grid');

demos.forEach(({ file, title, desc, tags, tagClass }) => {
  const card = document.createElement('div');
  card.className = 'card';

  const wrap = document.createElement('div');
  wrap.className = 'canvas-wrap';

  const canvas = document.createElement('canvas');
  canvas.width = 280;
  canvas.height = 200;

  const dot = document.createElement('div');
  dot.className = 'status-dot';

  wrap.appendChild(canvas);
  wrap.appendChild(dot);

  const body = document.createElement('div');
  body.className = 'card-body';

  const h = document.createElement('div');
  h.className = 'card-title';
  h.textContent = title;

  const p = document.createElement('div');
  p.className = 'card-desc';
  p.textContent = desc;

  const tagRow = document.createElement('div');
  tagRow.className = 'tag-row';
  tags.forEach(t => {
    const span = document.createElement('span');
    span.className = 'tag' + (tagClass ? ' ' + tagClass : '');
    span.textContent = t;
    tagRow.appendChild(span);
  });

  body.appendChild(h);
  body.appendChild(p);
  body.appendChild(tagRow);

  card.appendChild(wrap);
  card.appendChild(body);
  grid.appendChild(card);

  try {
    const r = new rive.Rive({
      src: file,
      canvas,
      autoplay: true,
      onLoad: () => {
        dot.classList.add('ok');
        r.resizeDrawingSurfaceToCanvas();
      },
      onLoadError: (e) => {
        dot.classList.add('err');
        console.error(file, e);
      },
    });
  } catch (e) {
    dot.classList.add('err');
    console.error(file, e);
  }
});
</script>
</body>
</html>
